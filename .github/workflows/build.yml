name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configure Git
        run: |
          git config core.quotepath false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install uv && \
          python3 -m uv sync

      - name: Build and verify the site
        env:
          AI4FM_BASE_URL: https://ericspencer.us/ai4fm/
        run: |
          ./.venv/bin/sphinx-build -b dirhtml -W --keep-going --write-all src build
          sed -i 's#https://ai4fm.cs.luc.edu/#https://ericspencer.us/ai4fm/#g' build/robots.txt
          ./.venv/bin/python scripts/check-site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

